; XIAO ESP32S3 Sense MJPEG 스트리밍 펌웨어
; 노트북의 Flask + YOLO 서버가 http://<IP>/stream 을 받아 인식한다.

; 프로젝트 경로에 한글이나 공백이 있으면(예: "바탕 화면") 링크 단계에서
; "cannot open map file" 오류가 난다. 그래서 빌드 결과물만 영문 경로에 둔다.
; macOS / Linux 에서는 이 두 줄을 지우거나 주석 처리한다.
[platformio]
build_dir = C:/pio_build/xiao_cam

[env:xiao_esp32s3_sense]
; 플랫폼 버전을 고정해 실습실 PC마다 같은 Arduino 코어로 빌드되게 한다.
platform = espressif32 @ 8.0.0
board = seeed_xiao_esp32s3
framework = arduino

; XIAO ESP32S3 Sense 는 8MB Octal PSRAM 을 탑재한다.
; qio_opi = 플래시 QIO + PSRAM OPI. 이 설정이 없으면 PSRAM 을 찾지 못한다.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; esp32-camera 를 lib_deps 에 추가하지 않는다.
; Arduino-ESP32 코어(3.x)에 esp32-camera 컴포넌트가 미리 컴파일되어 내장되어 있어
; esp_camera.h 를 바로 include 할 수 있다. lib_deps 로 한 번 더 받으면 같은 심볼이
; 두 번 링크되어 "multiple definition" 링크 오류가 나거나 헤더 버전이 어긋난다.
; lib_deps =

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
